<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado de Questões - Itajaí</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --correct-text: #15803d;
            --incorrect-bg: #fee2e2;
            --incorrect-border: #ef4444;
            --incorrect-text: #b91c1c;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 16px;
        }

        /* Seletor de Temas */
        .theme-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .theme-btn {
            background-color: #e2e8f0;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
            transition: background 0.2s, color 0.2s;
        }

        .theme-btn:hover {
            background-color: #cbd5e1;
        }

        .theme-btn.active {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        /* Painel de Estatísticas */
        .stats-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .btn-reset {
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-reset:hover {
            background-color: #e2e8f0;
        }

        /* Card da Questão */
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .option-item:hover:not(.disabled) {
            background-color: #f1f5f9;
        }

        .option-letter {
            font-weight: 700;
            background: #e2e8f0;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 0.9rem;
        }

        .option-text {
            flex: 1;
        }

        /* Estados de Resposta */
        .option-item.disabled {
            cursor: default;
        }

        .option-item.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
        }

        .option-item.correct .option-letter {
            background-color: var(--correct-border);
            color: #ffffff;
        }

        .option-item.incorrect {
            background-color: var(--incorrect-bg);
            border-color: var(--incorrect-border);
            color: var(--incorrect-text);
        }

        .option-item.incorrect .option-letter {
            background-color: var(--incorrect-border);
            color: #ffffff;
        }

        /* Explicação */
        .explanation {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background-color: #f8fafc;
            border-left: 4px solid var(--primary-color);
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
        }

        .explanation h4 {
            margin-bottom: 6px;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Simulado de Questões - Itajaí</h1>
        <div class="theme-selector" id="themeSelector"></div>
    </header>

    <div class="stats-panel">
        <div class="stat-item">
            <span class="stat-label">Respondidas</span>
            <span class="stat-value" id="statAnswered">0 / 0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Acertos</span>
            <span class="stat-value" id="statCorrect">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Aproveitamento</span>
            <span class="stat-value" id="statScore">0%</span>
        </div>
        <button class="btn-reset" onclick="resetCurrentTheme()">Embaralhar / Reiniciar</button>
    </div>

    <div id="quizContainer"></div>
</div>

let currentThemeId = quizData[0].themeId;
let userAnswers = {};

function initApp() {
    renderThemeSelector();
    loadTheme(currentThemeId);
}

function renderThemeSelector() {
    const container = document.getElementById('themeSelector');
    container.innerHTML = '';
    
    quizData.forEach(theme => {
        const btn = document.createElement('button');
        btn.className = `theme-btn ${theme.themeId === currentThemeId ? 'active' : ''}`;
        btn.innerText = theme.themeName;
        btn.onclick = () => {
            currentThemeId = theme.themeId;
            renderThemeSelector();
            loadTheme(currentThemeId);
        };
        container.appendChild(btn);
    });
}

function loadTheme(themeId) {
    const theme = quizData.find(t => t.themeId === themeId);
    if (!theme) return;

    const container = document.getElementById('quizContainer');
    container.innerHTML = '';

    theme.questions.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card_${q.id}`;

        const letters = ['A', 'B', 'C', 'D'];
        
        let optionsHtml = q.options.map((opt, optIdx) => {
            return `
                <li class="option-item" id="opt_${q.id}_${optIdx}" onclick="selectOption('${q.id}', ${optIdx}, ${q.correct})">
                    <span class="option-letter">${letters[optIdx]}</span>
                    <span class="option-text">${opt}</span>
                </li>
            `;
        }).join('');

        card.innerHTML = `
            <div class="question-header">
                <span>Questão ${index + 1} de ${theme.questions.length}</span>
                <span>ID: ${q.id}</span>
            </div>
            <div class="question-text">${q.text}</div>
            <ul class="options-list">
                ${optionsHtml}
            </ul>
            <div class="explanation" id="exp_${q.id}">
                <h4>Fundamentação / Comentário:</h4>
                <p>${q.explanation}</p>
            </div>
        `;

        container.appendChild(card);
    });

    theme.questions.forEach(q => {
        if (userAnswers[q.id] !== undefined) {
            applyAnswerToUI(q.id, userAnswers[q.id], q.correct);
        }
    });

    updateStats();
}

function selectOption(questionId, selectedIdx, correctIdx) {
    if (userAnswers[questionId] !== undefined) return;

    userAnswers[questionId] = selectedIdx;
    applyAnswerToUI(questionId, selectedIdx, correctIdx);
    updateStats();
}

function applyAnswerToUI(questionId, selectedIdx, correctIdx) {
    const card = document.getElementById(`card_${questionId}`);
    const options = card.querySelectorAll('.option-item');
    const exp = document.getElementById(`exp_${questionId}`);

    options.forEach((opt, idx) => {
        opt.classList.add('disabled');
        if (idx === correctIdx) {
            opt.classList.add('correct');
        }
        if (idx === selectedIdx && selectedIdx !== correctIdx) {
            opt.classList.add('incorrect');
        }
    });

    exp.style.display = 'block';
}

function updateStats() {
    const currentTheme = quizData.find(t => t.themeId === currentThemeId);
    if (!currentTheme) return;

    let total = currentTheme.questions.length;
    let answered = 0;
    let correct = 0;

    currentTheme.questions.forEach(q => {
        if (userAnswers[q.id] !== undefined) {
            answered++;
            if (userAnswers[q.id] === q.correct) {
                correct++;
            }
        }
    });

    let score = answered > 0 ? Math.round((correct / answered) * 100) : 0;

    document.getElementById('statAnswered').innerText = `${answered} / ${total}`;
    document.getElementById('statCorrect').innerText = correct;
    document.getElementById('statScore').innerText = `${score}%`;
}

function resetCurrentTheme() {
    const currentTheme = quizData.find(t => t.themeId === currentThemeId);
    if (!currentTheme) return;

    currentTheme.questions.forEach(q => {
        delete userAnswers[q.id];
    });

    currentTheme.questions.sort(() => Math.random() - 0.5);

    loadTheme(currentThemeId);
}

document.addEventListener('DOMContentLoaded', initApp);
