<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapientia - Simulado Itajaí</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #3b82f6;
            --accent: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* Dashboard Styles */
        #dashboard { display: block; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 10px;
        }
        .theme-list {
            text-align: left;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .theme-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }

        /* Quiz Styles */
        #quiz-container { display: none; }
        .quiz-header {
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
        }
        .tema-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .btn-voltar {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .option-btn {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }
        .option-btn:hover { background: #f1f5f9; border-color: var(--primary); }
        
        .btn-start {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- DASHBOARD INICIAL -->
        <div id="dashboard">
            <h1>Simulado Itajaí</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <div id="total-questoes">--</div>
                    <small>Total de Questões</small>
                </div>
                <div class="stat-card" style="background: var(--accent);">
                    <div>Agente de Serviços</div>
                    <small>Cargo Alvo</small>
                </div>
            </div>
            
            <div class="theme-list" id="lista-temas">
                <strong>Distribuição por Temas:</strong>
                <p>Carregando temas...</p>
            </div>

            <button class="btn-start" onclick="iniciarQuiz()">Começar Simulado</button>
        </div>

        <!-- QUIZ CONTAINER -->
        <div id="quiz-container">
            <div class="quiz-header">
                <div class="stats-bar">
                    <span><i class="fas fa-trophy"></i> <span id="current-score">0</span></span>
                    <span id="tema-pergunta" class="tema-badge">TEMA</span>
                    <span><i class="fas fa-clock"></i> <span id="timer">00:00</span></span>
                </div>
                <button onclick="voltarParaHome()" class="btn-voltar">
                    <i class="fas fa-home"></i> Voltar
                </button>
            </div>

            <h2 id="pergunta-texto">Carregando pergunta...</h2>
            <div class="options-container" id="opcoes"></div>
        </div>
    </div>

    <script>
        let perguntas = [];
        let indexAtual = 0;
        let acertos = 0;

        // Carrega os dados do Dashboard ao iniciar
        async function carregarDashboard() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                document.getElementById('total-questoes').innerText = data.total;
                
                const lista = document.getElementById('lista-temas');
                lista.innerHTML = '<strong>Distribuição por Temas:</strong>';
                data.temas.forEach(t => {
                    lista.innerHTML += `
                        <div class="theme-item">
                            <span>${t.categoria}</span>
                            <span>${t.quantidade}</span>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Erro ao carregar dashboard", e);
            }
        }

        async function iniciarQuiz() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            
            const response = await fetch('/api/perguntas');
            perguntas = await response.json();
            mostrarPergunta();
        }

        function mostrarPergunta() {
            if(indexAtual >= perguntas.length) {
                alert("Fim do Simulado! Acertos: " + acertos);
                voltarParaHome();
                return;
            }

            const p = perguntas[indexAtual];
            document.getElementById('pergunta-texto').innerText = p.pergunta;
            document.getElementById('tema-pergunta').innerText = p.tema || "Geral";
            
            const containerOpcoes = document.getElementById('opcoes');
            containerOpcoes.innerHTML = '';
            
            p.opcoes.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => verificarResposta(i);
                containerOpcoes.appendChild(btn);
            });
        }

        function verificarResposta(escolha) {
            if(escolha === perguntas[indexAtual].correta) {
                acertos++;
                document.getElementById('current-score').innerText = acertos;
                alert("Correto!");
            } else {
                alert("Errado! " + perguntas[indexAtual].explicacao);
            }
            indexAtual++;
            mostrarPergunta();
        }

        function voltarParaHome() {
            window.location.reload();
        }

        // Inicia
        carregarDashboard();
    </script>
</body>
</html>
