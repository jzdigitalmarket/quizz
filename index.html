<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapientia - Simulado Itajaí</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        :root { --primary: #2563eb; --accent: #f59e0b; --danger: #ef4444; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { width: 95%; max-width: 550px; background: white; padding: 1.2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }

        /* DASHBOARD */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat-card { background: var(--primary); color: white; padding: 15px; border-radius: 12px; text-align: center; }
        .theme-list { text-align: left; background: #f1f5f9; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-size: 0.9rem; }
        .theme-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #e2e8f0; }

        /* QUIZ HEADER COMPACTO */
        #quiz-container { display: none; }
        .quiz-header { background: var(--primary); color: white; padding: 12px; border-radius: 12px; margin-bottom: 20px; }
        .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .tema-badge { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .btn-voltar { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; width: 100%; }

        /* PERGUNTA E OPÇÕES */
        #pergunta-texto { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; line-height: 1.4; text-align: center; color: var(--text); }
        .options-container { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .option-btn { 
            padding: 14px 18px; border: 2px solid #e2e8f0; border-radius: 10px; background: white; 
            cursor: pointer; transition: 0.2s; text-align: left; font-size: 0.95rem; color: var(--text);
            display: block; width: 100%; box-sizing: border-box;
        }
        .option-btn:hover { border-color: var(--primary); background: #eff6ff; transform: translateY(-2px); }

        .btn-start { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 1.1rem; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <div id="dashboard">
            <h2 style="margin-top:0">Sapientia Itajaí</h2>
            <div class="stats-grid">
                <div class="stat-card"><div id="total-questoes" style="font-size:1.5rem; font-weight:bold">--</div><small>Questões</small></div>
                <div class="stat-card" style="background:var(--accent)"><div>Geral</div><small>Nível Agente</small></div>
            </div>
            <div class="theme-list" id="lista-temas"><strong>Carregando categorias...</strong></div>
            <button class="btn-start" onclick="iniciarQuiz()">Iniciar Simulado</button>
        </div>

        <div id="quiz-container">
            <div class="quiz-header">
                <div class="stats-bar">
                    <span><i class="fas fa-trophy"></i> <span id="current-score">0</span></span>
                    <span id="tema-pergunta" class="tema-badge">GERAL</span>
                    <span><i class="fas fa-clock"></i> <span id="timer">00:00</span></span>
                </div>
                <button onclick="voltarParaHome()" class="btn-voltar"><i class="fas fa-home"></i> VOLTAR AO INÍCIO</button>
            </div>
            <div id="pergunta-texto">Carregando pergunta...</div>
            <div class="options-container" id="opcoes"></div>
        </div>
    </div>

    <script>
        let perguntas = [];
        let indexAtual = 0;
        let acertos = 0;

        async function carregarDashboard() {
            try {
                const res = await fetch('/function/api/stats');
                const data = await res.json();
                document.getElementById('total-questoes').innerText = data.total;
                const lista = document.getElementById('lista-temas');
                lista.innerHTML = '<strong>Distribuição:</strong>';
                data.temas.forEach(t => {
                    lista.innerHTML += `<div class="theme-item"><span>${t.categoria}</span><span><b>${t.quantidade}</b></span></div>`;
                });
            } catch (e) { console.error(e); }
        }

        async function iniciarQuiz() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            const res = await fetch('/api/perguntas');
            perguntas = await res.json();
            mostrarPergunta();
        }

        function mostrarPergunta() {
            if(indexAtual >= perguntas.length) {
                alert("Fim! Acertos: " + acertos);
                voltarParaHome();
                return;
            }
            const p = perguntas[indexAtual];
            document.getElementById('pergunta-texto').innerText = p.pergunta;
            document.getElementById('tema-pergunta').innerText = p.tema || "Geral";
            
            const container = document.getElementById('opcoes');
            container.innerHTML = ''; // Limpa botões antigos
            
            p.opcoes.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<b>${String.fromCharCode(65 + i)}</b> &nbsp; ${opt}`;
                btn.onclick = () => verificarResposta(i);
                container.appendChild(btn);
            });
        }

        function verificarResposta(escolha) {
            if(escolha === perguntas[indexAtual].correta) {
                acertos++;
                document.getElementById('current-score').innerText = acertos;
                alert("🎉 Correto!");
            } else {
                alert("❌ Incorreto!\\n\\n" + perguntas[indexAtual].explicacao);
            }
            indexAtual++;
            mostrarPergunta();
        }

        function voltarParaHome() { window.location.reload(); }
        carregarDashboard();
    </script>
</body>
</html>
