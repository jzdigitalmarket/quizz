<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapientia - Simulado Itajaí</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #3b82f6;
            --accent: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 650px;
            background: white;
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* DASHBOARD */
        #dashboard { display: block; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .stat-card { background: var(--primary); color: white; padding: 20px; border-radius: 15px; }
        .theme-list { text-align: left; background: #f1f5f9; padding: 20px; border-radius: 15px; margin-bottom: 20px; max-height: 250px; overflow-y: auto; }
        .theme-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e2e8f0; }

        /* QUIZ HEADER */
        #quiz-container { display: none; }
        .quiz-header {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            position: relative;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .tema-badge {
            background: rgba(255,255,255,0.25);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-voltar {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-voltar:hover { opacity: 0.9; transform: scale(1.05); }

        /* PERGUNTA E RESPOSTAS */
        #pergunta-texto {
            font-size: 1.3rem;
            margin-bottom: 25px;
            color: var(--text);
            line-height: 1.4;
            padding: 0 10px;
        }
        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .option-btn {
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-size: 1rem;
            color: var(--text);
            display: flex;
            align-items: center;
        }
        .option-btn:hover {
            border-color: var(--primary);
            background: #eff6ff;
            transform: translateX(5px);
        }
        .option-btn:active { transform: scale(0.98); }

        .btn-start {
            background: var(--accent);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="dashboard">
            <h1>Sapientia Itajaí</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <div id="total-questoes" style="font-size: 2rem; font-weight: bold;">--</div>
                    <small>Questões no Banco</small>
                </div>
                <div class="stat-card" style="background: var(--accent);">
                    <div style="font-size: 1.2rem; font-weight: bold;">Geral</div>
                    <small>Nível Agente</small>
                </div>
            </div>
            
            <div class="theme-list" id="lista-temas">
                <strong>Categorias:</strong>
                <p>Carregando temas...</p>
            </div>

            <button class="btn-start" onclick="iniciarQuiz()">Iniciar Simulado</button>
        </div>

        <div id="quiz-container">
            <div class="quiz-header">
                <div class="stats-bar">
                    <span><i class="fas fa-trophy"></i> <span id="current-score">0</span></span>
                    <span id="tema-pergunta" class="tema-badge">CARREGANDO...</span>
                    <span><i class="fas fa-clock"></i> <span id="timer">00:00</span></span>
                </div>
                <button onclick="voltarParaHome()" class="btn-voltar">
                    <i class="fas fa-arrow-left"></i> Voltar ao Início
                </button>
            </div>

            <div id="pergunta-texto">Carregando pergunta...</div>
            <div class="options-container" id="opcoes"></div>
        </div>
    </div>

    <script>
        let perguntas = [];
        let indexAtual = 0;
        let acertos = 0;

        // Dashboard
        async function carregarDashboard() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                document.getElementById('total-questoes').innerText = data.total;
                const lista = document.getElementById('lista-temas');
                lista.innerHTML = '<strong>Distribuição por Temas:</strong>';
                data.temas.forEach(t => {
                    lista.innerHTML += `
                        <div class="theme-item">
                            <span>${t.categoria}</span>
                            <span><b>${t.quantidade}</b></span>
                        </div>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        // Quiz
        async function iniciarQuiz() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            const response = await fetch('/api/perguntas');
            perguntas = await response.json();
            // Embaralhar se desejar
            mostrarPergunta();
        }

        function mostrarPergunta() {
            if(indexAtual >= perguntas.length) {
                alert("Simulado concluído! Total de acertos: " + acertos);
                voltarParaHome();
                return;
            }

            const p = perguntas[indexAtual];
            document.getElementById('pergunta-texto').innerText = p.pergunta;
            document.getElementById('tema-pergunta').innerText = p.tema || "Geral";
            
            const containerOpcoes = document.getElementById('opcoes');
            containerOpcoes.innerHTML = '';
            
            p.opcoes.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<b>${String.fromCharCode(65 + i)})</b> &nbsp; ${opt}`;
                btn.onclick = () => verificarResposta(i);
                containerOpcoes.appendChild(btn);
            });
        }

        function verificarResposta(escolha) {
            const correta = perguntas[indexAtual].correta;
            if(escolha === correta) {
                acertos++;
                document.getElementById('current-score').innerText = acertos;
                alert("🎉 Correto!");
            } else {
                alert("❌ Errado.\\n\\nExplicação: " + perguntas[indexAtual].explicacao);
            }
            indexAtual++;
            mostrarPergunta();
        }

        function voltarParaHome() {
            window.location.reload();
        }

        carregarDashboard();
    </script>
</body>
</html>
